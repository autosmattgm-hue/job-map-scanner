<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | MAT LEADS AI PRO X</title>
    <meta name="description" content="Manage your MAT LEADS AI PRO X account profile.">
    <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body data-page="profile">
    <div class="app-layout" data-app-shell>
      <main class="workspace">
        <section class="workspace-header">
          <div><h1>Profile</h1><p>Workspace identity, sales signature, and account access.</p></div>
          <button class="btn btn-secondary" type="button" data-logout>Logout</button>
        </section>
        <section class="detail-layout">
          <form class="panel form-grid compact">
            <div class="field"><label for="name">Name</label><input id="name" value="Admin Owner"></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" value="owner@matleads.local"></div>
            <div class="field"><label for="company">Company</label><input id="company" value="MAT Leads AI Pro X"></div>
            <div class="field" style="grid-column:1 / -1;"><label for="signature">Sales Signature</label><textarea id="signature">Best regards, MAT Leads AI Pro X</textarea></div>
            <button class="btn btn-primary" type="button">Save Profile</button>
          </form>
          <aside class="panel">
            <h2>Session Management</h2>
            <div class="audit-list">
              <div class="audit-item"><span>Current session</span><span class="status-pill success">Admin Unlimited</span></div>
              <div class="audit-item"><span>Feature access</span><span class="status-pill success">All Unlocked</span></div>
              <div class="audit-item"><span>MFA readiness</span><span class="status-pill warning">Ready</span></div>
              <div class="audit-item"><span>Password reset</span><span class="status-pill success">Enabled</span></div>
            </div>
          </aside>
        </section>
      </main>
    </div>
    <script type="module" src="/components/layout.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
